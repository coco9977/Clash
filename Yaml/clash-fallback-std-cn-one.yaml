Nikki 透明代理配置指南
与 Gemini 对话
你说
nikki要怎样配置

Gemini 说
看来你正在为软路由配置基于 OpenWrt 的透明代理插件 Nikki（它的底层内核是 Mihomo，也就是以前大家熟悉的 Clash.Meta）。相比老牌的 OpenClash，Nikki 更加轻量且贴近原生，配置逻辑也相对清晰。

以下是 Nikki 最核心、最稳妥的基础配置流程：

1. 导入订阅节点 (Profiles)
这是让你的 Nikki 获取节点信息的第一步：

进入 OpenWrt 路由器的后台，打开 Nikki 插件。

找到 配置文件 (Profiles) 标签页。

添加一个新的配置文件，在 URL 处填入你的服务商提供的 Clash / Clash Meta 订阅链接。

点击 保存，然后点击对应的 更新 (Update) 按钮。

留意一下系统日志或状态提示，确保显示配置文件下载并解析成功。

2. 设置透明代理 (Proxy)
这里的设置决定了局域网设备的流量如何被 Nikki 接管：

开启透明代理 (Transparent Proxy)： 必须勾选，这是软路由科学上网的核心。

TCP 代理模式： 推荐选择 Redirect（重定向）或 TPROXY。对于绝大多数新手而言，Redirect 的兼容性最好、最不容易报错。

UDP 代理模式： 推荐选择 TPROXY（需要内核支持）或 TUN。如果你经常玩外服游戏或看 Twitch 直播，UDP 转发非常关键。

网络代理 (IP 设置)： 勾选 IPv4 代理。如果你的局域网环境开启了 IPv6，强烈建议也勾选 IPv6 代理（否则可能会出现部分网站打不开的情况）；如果不懂 IPv6，建议在路由器层面直接禁用 IPv6，能省去很多麻烦。

DNS 劫持 (DNS Hijack)： 必须勾选（包括 IPv4 和 IPv6）。这能确保内网设备的域名解析请求全部交给 Nikki 的内置 DNS 处理，防止 DNS 污染。

3. 启动服务与节点选择 (Enable & Dashboard)
回到 全局设置/状态 (Config/Status) 页面。

勾选顶部的 启用 (Enabled)。

点击页面底部的 保存并应用 (Save & Apply)。

等待几秒钟，确认核心状态显示为“运行中”后，点击界面上提供的 控制面板 (Dashboard) 入口（通常是 Yacd 或 Metacubed 的网页）。

在面板的 代理 (Proxies) 选项卡中，展开你的节点组，选择你想使用的节点。

💡 进阶建议：访问控制 (Access Control)
如果你的局域网里有下载机 (PT/BT)、NAS 或者只看国内平台的电视盒子，强烈建议去 Nikki 的 访问控制 页面，将这些设备的 IP 地址或 MAC 地址策略设置为 Direct (直连)。这样既能避免消耗你的代理流量，也能防止因为代理 BT 流量导致机场账号被封。

请问你在配置过程中有遇到什么具体的卡点吗？ 需要我帮你看看启动报错日志，或者教你怎么配置 Fake-IP 来提升网页秒开速度吗？

你说
Fake-IP怎么设置

Gemini 说
配置 Fake-IP（伪装 IP） 是软路由玩家实现“网页秒开”的终极秘籍。

简单来说，平时你打开网页，路由器要先去问 DNS 拿到真实 IP，然后才能建立连接；而在 Fake-IP 模式下，Nikki 会瞬间秒回一个“假 IP”（比如 198.18.0.5）骗过你的电脑，让电脑立刻发包，真正的域名解析和连接则全部丢给远端的代理节点去处理。这省去了本地 DNS 等待的时间。

以下是在 Nikki 中配置 Fake-IP 的标准步骤：

1. 开启 Fake-IP 模式
登录 OpenWrt，进入 Nikki 插件界面。

找到并进入 DNS 设置 (DNS) 页面。

确保 启用 DNS (Enable DNS) 已勾选。

找到 增强模式 (Enhanced Mode) 或 解析模式，将其从 Redir-Host（或普通模式）修改为 Fake-IP。

Fake-IP 范围 (Fake-IP Range)： 保持默认的 198.18.0.1/16 即可，不需要改动。

2. 设置 Fake-IP 过滤名单（核心关键）
这一步非常重要。由于 Fake-IP 会返回假 IP，如果路由器自身的组件（如时间同步、DDNS）或局域网设备也拿到假 IP，就会导致路由器断网或内网无法访问。

在 DNS 设置页面找到 Fake-IP 过滤名单 (Fake-IP Filter)。你需要在这里填入必须使用真实 IP 的域名（每行一个），建议填入以下基础列表：

Plaintext
*.lan
*.localdomain
*.example
*.invalid
*.localhost
*.test
*.local
*.home.arpa
time.*.com
time.*.gov
time.*.edu
time1.*.com
time2.*.com
time3.*.com
time4.*.com
time5.*.com
time6.*.com
time7.*.com
ntp.*.com
ntp.*.gov
ntp1.*.com
ntp2.*.com
ntp3.*.com
ntp4.*.com
ntp5.*.com
ntp6.*.com
ntp7.*.com
*.time.edu.cn
*.ntp.org.cn
+.pool.ntp.org
time1.cloud.tencent.com
stun.*.*
stun.*.*.*
+.stun.*.*
+.stun.*.*.*
+.stun.*.*.*.*
如果你使用了阿里云盘、软路由 DDNS（动态域名解析）或者 Xbox/PS5 主机联机，也要把对应的域名加进名单里。

3. 保存并刷新缓存
检查无误后，点击页面底部的 保存并应用 (Save & Apply)。

重启 Nikki 服务以确保 DNS 缓存清空并使新规则生效。

关键动作： 在你的电脑或手机上断开 WiFi 重新连接，或者在电脑的命令提示符（CMD）里运行 ipconfig /flushdns 来清空本地 DNS 缓存。

💡 配置后的正常现象（不用慌）
开启 Fake-IP 后，如果你在电脑的终端里 ping www.google.com 或 ping www.baidu.com，你会发现返回的 IP 变成了 198.18.x.x。这是绝对正常的现象，说明 Fake-IP 已经成功接管了你的 DNS 解析！只要网页能正常打开就代表一切完美运行。

需要我为你提供一份针对游戏主机（如 Switch、PS5、Xbox）或国内常用流媒体（如 B站、微信）的专属 Fake-IP 过滤名单吗？ 这样可以防止游戏联机变 NAT 类型 C，或避免部分国内 APP 加载缓慢。

你说
帮我优化一下规则

Gemini 说
这份配置文件的基础结构写得很不错，使用了先进的 rule-providers 和 .mrs (Meta 专属格式) 规则集，非常契合 Nikki (Mihomo 内核) 的特性。

不过，为了让日常使用更顺畅、路由器性能占用更低、控制面板（Dashboard）更清爽，我帮你进行了四个核心方向的优化：

修复 AI 分流痛点： 原配置中 人工智能 策略组包含了香港节点。由于 ChatGPT、Claude、Gemini 等服务通常会封锁香港 IP，我为你单独写了 AI 的策略，剔除了香港节点，防止 AI 服务频繁报错。

Apple 国内服务直连： 原配置把 Apple-CN 也交给了代理组。这会导致你在国内下载 App Store 软件或同步 iCloud 时速度极慢。我已将其修正为指向 国内 (直连)。

精简控制面板 UI： 原来的 &default 模板把所有的“手动”、“自动”、“故转”都塞进了每一个业务组里，导致面板非常臃肿。我简化了选项卡，让业务组只选择最具代表性的策略（比如各地区的“自动”或“故转”）。

正则表达式减负： 原来的节点过滤正则（如 (?=.*(广港...)).*$）属于复杂的零宽断言，对路由器的 CPU 性能消耗较大。我将其简化为了最高效的直接匹配模式 (广港|香港|HK|Hong Kong|🇭🇰|HongKong)，效果完全一样但更轻量。

优化后的完整配置文件
你可以直接复制以下代码替换掉你原来的配置：

YAML
# ========================
# Clash-Meta / Nikki 优化配置
# ========================

# 机场节点订阅
proxy-providers:
  聚合机场:
    url: "机场订阅地址"  
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
    proxy: 直连

proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ========================
# 策略组定义模板
# ========================
# 常规业务默认选择模板（精简了面板显示，保留最核心的选项）
default: &default
  type: select
  proxies:
    - 所有-自动
    - 所有-手动
    - 香港-自动
    - 台湾-自动
    - 日本-自动
    - 新加坡-自动
    - 美国-自动
    - 其他-自动
    - 直连

# AI专属模板（重要优化：剥离了香港节点，防止 ChatGPT/Claude/Gemini 封号或拒绝访问）
ai_default: &ai_default
  type: select
  proxies:
    - 台湾-自动
    - 日本-自动
    - 新加坡-自动
    - 美国-自动
    - 所有-手动
    - 直连

proxy-groups:
  # --- 业务分流组 ---
  - {name: 人工智能, <<: *ai_default} # 使用剔除香港节点的模板
  - {name: 流媒体, <<: *default}
  - {name: 谷歌, <<: *default}  
