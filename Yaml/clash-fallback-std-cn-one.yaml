  - {name: 测试, <<: *default}
  - {name: 国外, <<: *default}
  - {name: 其他, <<: *default}
  
  # 国内直连组
  - name: 国内
    type: select
    proxies:
      - 直连
      - 所有-自动 # 预留代理选项以备不时之需

  # --- 节点池定义 ---
  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝)).)*$"

  - name: 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "^((?!(直连|拒绝)).)*$"

  # --- 地区分组 (正则已优化，降低软路由CPU负载) ---
  - name: 香港-自动
